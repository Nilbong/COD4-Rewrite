[workspace]
resolver = "3"
members = ["crates/iw3", "crates/iw4", "crates/gsc", "crates/t4", "crates/t5", "crates/game", "crates/net", "crates/multiplayer", "crates/launcher"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
flate2 = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
bevy = "0.19.1"
avian3d = "0.7"

# Asset parsing is unusably slow in debug builds; optimise dependencies and the iw3 crate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.iw3]
opt-level = 3

# Quick iteration builds for testing (`cargo build --profile fast`, output in
# target/fast): optimised like release, but incremental and split into many
# codegen units, so a small change rebuilds in about a minute instead of five.
# Release builds (what players and the GitHub release get) are unchanged.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
