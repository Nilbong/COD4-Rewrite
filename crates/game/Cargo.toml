[package]
name = "game"
description = "Call of Duty 4 multiplayer rewrite on Bevy, using assets from a local CoD4 install."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "cod4rw"
path = "src/main.rs"

[dependencies]
# Rasterises the modern main menu's system font (ui/modern.rs).
ab_glyph = "0.2"
# Cuts the controller button art out of its atlases (gamepad/glyphs.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
iw3 = { path = "../iw3" }
t5 = { path = "../t5" }
t4 = { path = "../t4" }
anyhow.workspace = true
flate2.workspace = true
log.workspace = true
# mp3 and wav for CoD4's music and sounds.
bevy = { workspace = true, features = ["mp3", "wav"] }
avian3d.workspace = true
rand = "0.9"
serde_json = "1"
winit = { version = "0.30", default-features = false }
cod4rw-net = { path = "../net" }
# Online private matches through a relay (crates/multiplayer).
cod4rw-multiplayer = { path = "../multiplayer" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
half = "2"
# Offline lighting re-bake (src/bake): a BVH, its maths, and threads.
obvhs = "0.3.3"
glam33 = { package = "glam", version = "0.33" }
rayon = "1"

# DualSense and DualShock 4 rumble: Windows' controller API (through gilrs)
# can't rumble them, so it goes to them as HID output reports.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }

[dev-dependencies]
# `examples/padcheck.rs`: what gilrs makes of the controllers.
gilrs = "0.11"

[features]
# Test features, off in the normal build: ray-traced lighting (Bevy's Solari;
# Options > Graphics > Lighting) and the Diamond mastery camo.
raytracing = ["bevy/bevy_solari"]
diamond = []

[build-dependencies]
winresource = "0.1"
